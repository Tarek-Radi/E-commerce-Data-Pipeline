version: 2

models:
  - name: fct_order_items
    description: "Main fact table at order-item grain."
    columns:
      - name: order_id
        description: "Unique identifier for the order."
        tests:
          - not_null

      - name: order_item_id
        description: "Item sequence number within each order."
        tests:
          - not_null

      - name: customer_id
        description: "Customer identifier linked to the order."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: product_id
        description: "Product identifier linked to the ordered item."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

      - name: seller_id
        description: "Seller identifier linked to the ordered item."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id

      - name: price
        description: "Item price."
        tests:
          - not_null

  - name: dim_customers
    description: "Customer dimension."
    columns:
      - name: customer_id
        description: "Operational customer identifier."
        tests:
          - not_null
          - unique

  - name: dim_products
    description: "Product dimension."
    columns:
      - name: product_id
        description: "Unique product identifier."
        tests:
          - not_null
          - unique

  - name: dim_sellers
    description: "Seller dimension."
    columns:
      - name: seller_id
        description: "Unique seller identifier."
        tests:
          - not_null
          - unique